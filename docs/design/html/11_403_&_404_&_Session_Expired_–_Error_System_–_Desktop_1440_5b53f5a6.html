<script>
    function switchState(targetStateId) {
      var panels = document.querySelectorAll('.state-panel');
      panels.forEach(function(panel) {
        panel.classList.add('hidden');
      });

      var activePanel = document.getElementById(targetStateId);
      if (activePanel) {
        activePanel.classList.remove('hidden');
      }

      var buttons = document.querySelectorAll('.state-tab-btn');
      buttons.forEach(function(btn) {
        btn.className = 'state-tab-btn flex items-center gap-2 px-4 py-2 rounded-lg font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high';
        var dot = btn.querySelector('span');
        if (dot) {
          dot.className = 'w-2 h-2 rounded-full bg-outline';
        }
      });

      var activeBtnMap = {
        'state-403': 'tab-403',
        'state-404': 'tab-404',
        'state-expired': 'tab-expired'
      };

      var activeBtn = document.getElementById(activeBtnMap[targetStateId]);
      if (activeBtn) {
        activeBtn.className = 'state-tab-btn flex items-center gap-2 px-4 py-2 rounded-lg font-label-md text-label-md transition-all duration-200 bg-primary text-on-primary shadow-sm';
        var activeDot = activeBtn.querySelector('span');
        if (activeDot) {
          activeDot.className = 'w-2 h-2 rounded-full bg-on-primary';
        }
      }
    }
  </script>
